plugins { id 'com.android.application' }

android {
    namespace 'ca.kestrelsports.app'
    compileSdk 35
    defaultConfig {
        applicationId 'ca.kestrelsports.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    def releaseKeystore = System.getenv('KESTREL_KEYSTORE_FILE')
    if (releaseKeystore) {
        signingConfigs {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv('KESTREL_KEYSTORE_PASSWORD')
                keyAlias System.getenv('KESTREL_KEY_ALIAS')
                keyPassword System.getenv('KESTREL_KEY_PASSWORD')
            }
        }
        buildTypes {
            release { signingConfig signingConfigs.release }
        }
    }
}

dependencies { implementation 'androidx.browser:browser:1.8.0' }
