name: Build Android test APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: android-app
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Kestrel-Sports-Club-Android-Test-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
  release:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      KESTREL_KEYSTORE_BASE64: ${{ secrets.KESTREL_KEYSTORE_BASE64 }}
      KESTREL_KEYSTORE_PASSWORD: ${{ secrets.KESTREL_KEYSTORE_PASSWORD }}
      KESTREL_KEY_ALIAS: ${{ secrets.KESTREL_KEY_ALIAS }}
      KESTREL_KEY_PASSWORD: ${{ secrets.KESTREL_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate signing configuration
        run: |
          test -n "$KESTREL_KEYSTORE_BASE64" && test -n "$KESTREL_KEYSTORE_PASSWORD" && test -n "$KESTREL_KEY_ALIAS" && test -n "$KESTREL_KEY_PASSWORD" || { echo "Release signing secrets are not configured. See android-app/README.md"; exit 1; }
      - name: Restore signing keystore
        run: |
          echo "$KESTREL_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kestrel-release.jks"
          echo "KESTREL_KEYSTORE_FILE=$RUNNER_TEMP/kestrel-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        working-directory: android-app
        run: gradle --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Kestrel-Sports-Club-Android-Release-APK
          path: android-app/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
