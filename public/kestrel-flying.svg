<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 120" aria-label="Animated flying kestrel">
<defs><linearGradient id="feather" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fb923c"/><stop offset="1" stop-color="#9a3412"/></linearGradient></defs>
<g class="bird"><path d="M75 74 Q47 82 27 108 Q61 98 89 86" fill="#c2410c"/><path d="M92 40 Q108 45 111 66 Q109 86 92 94 Q74 83 77 62 Q79 45 92 40" fill="#ea580c" stroke="#7c2d12" stroke-width="2"/>
<g class="wing-left"><path d="M86 51 Q54 13 5 8 Q25 36 45 48 Q23 44 4 47 Q44 74 82 70Z" fill="url(#feather)" stroke="#7c2d12" stroke-width="2"/><path d="M12 15 Q45 49 78 61 M12 50 Q42 59 75 64" fill="none" stroke="#fed7aa" stroke-width="2"/></g>
<g class="wing-right"><path d="M99 50 Q132 12 175 7 Q155 37 134 48 Q156 44 176 48 Q140 75 102 69Z" fill="url(#feather)" stroke="#7c2d12" stroke-width="2"/><path d="M168 14 Q137 49 106 61 M168 50 Q140 59 107 64" fill="none" stroke="#fed7aa" stroke-width="2"/></g>
<path d="M83 45 Q89 24 104 29 Q119 37 107 52 Q94 58 83 45" fill="#fff7ed" stroke="#9a3412" stroke-width="2"/><circle cx="101" cy="39" r="3.5" fill="#111827"/><path d="M110 43 L124 47 L110 51Z" fill="#f59e0b"/></g>
<style>.wing-left{transform-origin:85px 58px;animation:left-flap 1.05s ease-in-out infinite}.wing-right{transform-origin:100px 58px;animation:right-flap 1.05s ease-in-out infinite}.bird{animation:bob 2.8s ease-in-out infinite}@keyframes left-flap{0%,100%{transform:rotate(0deg) scaleY(1)}50%{transform:rotate(13deg) scaleY(.35)}}@keyframes right-flap{0%,100%{transform:rotate(0deg) scaleY(1)}50%{transform:rotate(-13deg) scaleY(.35)}}@keyframes bob{0%,100%{transform:translateY(2px)}50%{transform:translateY(-3px)}}@media(prefers-reduced-motion:reduce){.wing-left,.wing-right,.bird{animation:none}}</style></svg>