@keyframes soccer {0%,28%{transform:translate(-28px,0) rotate(0deg)}48%{transform:translate(10px,-14px) rotate(65deg)}75%{transform:translate(85px,-50px) rotate(190deg)}100%{transform:translate(120px,-65px) rotate(240deg)}}50%{transform:translate(55px,-35px) rotate(200deg)}}
.ball-volley{animation:volley 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.shuttle{animation:shuttle 2.3s ease-in-out infinite;transform-origin:center}.racket{animation:racketSwing 2.3s ease-in-out infinite;transform-origin:420px 403px}.strike{animation:strikeFlash 2.3s ease-out infinite;transform-origin:435px 300px}
.ball-basket{animation:basket 1.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.ball-soccer{animation:soccer 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:reduce){.ball-volley,.shuttle,.ball-basket,.ball-soccer,.racket,.strike{animation:none}}
@keyframes playerMove{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}.athlete{animation:playerMove 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}.athlete-volley{animation-duration:2.6s}.athlete-badminton{animation-duration:2.3s}.athlete-basket{animation-duration:1.5s}.athlete-soccer{animation-duration:2.8s}.volley-arm,.badminton-arm,.basket-arm,.soccer-leg{transform-box:fill-box;transform-origin:top center}.volley-arm{animation:limbVolley 2.6s ease-in-out infinite}.badminton-arm{animation:limbBadminton 2.3s ease-in-out infinite}.basket-arm{animation:limbBasket 1.5s ease-in-out infinite}.soccer-leg{animation:limbSoccer 2.8s ease-in-out infinite}@keyframes limbVolley{0%,100%{transform:rotate(12deg)}35%{transform:rotate(-24deg)}}@keyframes limbBadminton{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(16deg)}}@keyframes limbBasket{0%,100%{transform:rotate(-15deg)}50%{transform:rotate(20deg)}}@keyframes limbSoccer{0%,100%{transform:rotate(-20deg)}50%{transform:rotate(22deg)}}@media(prefers-reduced-motion:reduce){.athlete,.volley-arm,.badminton-arm,.basket-arm,.soccer-leg{animation:none}}</style></defs><rect width="1200" height="600" fill="url(#navy)"/><path d="M0 40Q400 -30 1200 5" stroke="#5bc3ff" stroke-width="12" fill="none" opacity=".65"/><text x="600" y="78" fill="white" font-size="57" font-weight="800" font-family="Arial,sans-serif" text-anchor="middle" letter-spacing="5">KESTREL</text><text x="600" y="122" fill="#f8be50" font-size="29" font-family="Arial,sans-serif" text-anchor="middle" letter-spacing="7">SPORTS CLUB</text><g clip-path="url(#p1)"><rect y="145" width="330" height="365" fill="url(#v)"/><g class="athlete athlete-volley"><ellipse cx="67" cy="309" rx="21" ry="25" fill="#c88961"/><path d="M46 301q3-29 29-16l10 13-10-4-11-5-18 17" fill="#262632"/><path d="M54 334q-19 16-15 55l45 2q12-42-5-57z" fill="#f7b733"/><path d="M49 346q-19 6-30 33" stroke="#c88961" stroke-width="14" stroke-linecap="round"/><g 