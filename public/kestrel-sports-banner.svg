@keyframes volley {0%,100%{transform:translate(-20px,32px)}35%{transform:translate(5px,-18px)}55%{transform:translate(42px,-58px)}75%{transform:translate(62px,-90px)}}35%{transform:translate(16px,-43px)}70%{transform:translate(-9px,0)}}
@keyframes shuttle {0%,35%{transform:translate(40px,-35px) rotate(-25deg)}49%{transform:translate(0,0) rotate(0deg)}70%{transform:translate(-55px,-50px) rotate(-45deg)}100%{transform:translate(-85px,-95px) rotate(-65deg)}}40%{transform:translate(-12px,15px) rotate(12deg)}50%{transform:translate(-20px,22px) rotate(20deg)}90%{transform:translate(42px,-65px) rotate(-28deg)}}@keyframes racketSwing {0%,35%,100%{transform:rotate(-16deg)}49%{transform:rotate(12deg)}70%{transform:rotate(-6deg)}}48%,55%{transform:rotate(14deg)}70%{transform:rotate(-8deg)}}@keyframes strikeFlash {0%,43%,58%,100%{opacity:0;transform:scale(.4)}49%{opacity:1;transform:scale(1.4)}}
