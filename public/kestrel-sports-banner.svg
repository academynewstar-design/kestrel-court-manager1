<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="Kestrel Sports Club — Volleyball, Badminton, Basketball, Soccer"><defs><linearGradient id="navy" x2="1" y2="1"><stop stop-color="#081a37"/><stop offset="1" stop-color="#174879"/></linearGradient><linearGradient id="v" x2="0" y2="1"><stop stop-color="#4d89b0"/><stop offset="1" stop-color="#102b49"/></linearGradient><linearGradient id="b" x2="0" y2="1"><stop stop-color="#31868a"/><stop offset="1" stop-color="#093a4a"/></linearGradient><linearGradient id="bb" x2="0" y2="1"><stop stop-color="#a96e4e"/><stop offset="1" stop-color="#422b31"/></linearGradient><linearGradient id="s" x2="0" y2="1"><stop stop-color="#72a865"/><stop offset="1" stop-color="#143d42"/></linearGradient><clipPath id="p1"><path d="M0 145H320L240 510H0Z"/></clipPath><clipPath id="p2"><path d="M325 145H615L530 510H245Z"/></clipPath><clipPath id="p3"><path d="M620 145H915L825 510H535Z"/></clipPath><clipPath id="p4"><path d="M920 145H1200V510H830Z"/></clipPath><style>
@keyframes volley {0%,100%{transform:translate(0,35px)}35%{transform:translate(16px,-43px)}70%{transform:translate(-9px,0)}}
@keyframes shuttle {0%,100%{transform:translate(30px,-48px) rotate(-28deg)}40%{transform:translate(-12px,15px) rotate(12deg)}50%{transform:translate(-20px,22px) rotate(20deg)}90%{transform:translate(42px,-65px) rotate(-28deg)}}@keyframes racketSwing {0%,35%,100%{transform:rotate(-28deg)}48%,55%{transform:rotate(14deg)}70%{transform:rotate(-8deg)}}@keyframes strikeFlash {0%,43%,58%,100%{opacity:0;transform:scale(.4)}49%{opacity:1;transform:scale(1.4)}}
@keyframes basket {0%,100%{transform:translateY(-55px) scaleY(1)}48%{transform:translateY(40px) scaleY(.87)}58%{transform:translateY(40px) scaleY(.87)}}
@keyframes soccer {0%,100%{transform:translate(-48px,25px) rotate(-60deg)}50%{transform:translate(55px,-35px) rotate(200deg)}}
.ball-volley{animation:volley 2.6s ease-in-out infinite;transform-origin:center}
.shuttle{animation:shuttle 2.3s ease-in-out infinite;transform-origin:center}.racket{animation:racketSwing 2.3s ease-in-out infinite;transform-origin:420px 405px}.strike{animation:strikeFlash 2.3s ease-out infinite;transform-origin:435px 300px}
.ball-basket{animation:basket 1.5s ease-in infinite;transform-origin:center}
.ball-soccer{animation:soccer 2.8s ease-in-out infinite;transform-origin:center}
@media (prefers-reduced-motion:reduce){.ball-volley,.shuttle,.ball-basket,.ball-soccer,.racket,.strike{animation:none}}
</style></defs><rect width="1200" height="600" fill="url(#navy)"/><path d="M0 40Q400 -30 1200 5" stroke="#5bc3ff" stroke-width="12" fill="none" opacity=".65"/><text x="600" y="78" fill="white" font-size="57" font-weight="800" font-family="Arial,sans-serif" text-anchor="middle" letter-spacing="5">KESTREL</text><text x="600" y="122" fill="#f8be50" font-size="29" font-family="Arial,sans-serif" text-anchor="middle" letter-spacing="7">SPORTS CLUB</text><g clip-path="url(#p1)"><rect y="145" width="330" height="365" fill="url(#v)"/><g class="ball-volley"><text x="150" y="355" font-size="135" text-anchor="middle">🏐</text></g></g><g clip-path="url(#p2)"><rect x="240" y="145" width="380" height="365" fill="url(#b)"/><g class="racket"><path d="M420 403L435 332" stroke="#f5f7fa" stroke-width="9" stroke-linecap="round"/><ellipse cx="441" cy="296" rx="37" ry="49" fill="none" stroke="#f4c56c" stroke-width="7" transform="rotate(14 441 296)"/><path d="M410 275L471 313M411 296L463 330M419 258L470 290M418 320L463 268M432 338L460 264" stroke="#e4f7ff" stroke-width="2" opacity=".75"/></g><g class="shuttle"><path d="M442 299L430 275L449 278Z" fill="#fff"/><ellipse cx="440" cy="304" rx="9" ry="8" fill="#f4e4aa"/></g><g class="strike"><circle cx="435" cy="300" r="18" fill="none" stroke="#fff0a1" stroke-width="5"/><path d="M435 273V260M435 327V340M408 300H395M462 300H475" stroke="#fff0a1" stroke-width="5"/></g></g><g clip-path="url(#p3)"><rect x="530" y="145" width="400" height="365" fill="url(#bb)"/><g class="ball-basket"><text x="720" y="355" font-size="135" text-anchor="middle">🏀</text></g></g><g clip-path="url(#p4)"><rect x="825" y="145" width="375" height="365" fill="url(#s)"/><g class="ball-soccer"><text x="1015" y="355" font-size="135" text-anchor="middle">⚽</text></g></g><g stroke="#f5b638" stroke-width="5"><path d="M320 145L240 510M615 145L530 510M915 145L825 510"/></g><rect y="448" width="1200" height="62" fill="#071b37" opacity=".9"/><g fill="white" font-size="25" font-weight="bold" font-family="Arial,sans-serif" text-anchor="middle"><text x="140" y="488">VOLLEYBALL</text><text x="425" y="488">BADMINTON</text><text x="712" y="488">BASKETBALL</text><text x="1010" y="488">SOCCER</text></g><text x="600" y="564" text-anchor="middle" font-size="28" fill="white" font-family="Arial,sans-serif">Play • Stay Healthy • Build Community</text><path d="M0 591H1200" stroke="#f9bc40" stroke-width="9"/></svg>